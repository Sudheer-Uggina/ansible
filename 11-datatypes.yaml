- name: demo on datatypes
  hosts: local
  connection: local
  vars: 
    PROGRAM: "devops with aws"
    DURATION: 140 #int
    live: true  #bool
    details: #map/dectionary {}
    months: 4
    trainer: "siva"
    TOPICS: #list - 0r []
    - Linux
    - shell
    - ansible
  tasks:
  - name: print varaible
    ansible.builtin.debug:
        msg: |
          program: {{ PROGRAM }}
          Duration: {{DURATION}}
          live: {{live}}
          details: {{details}}
          topics: {{TOPICS}}